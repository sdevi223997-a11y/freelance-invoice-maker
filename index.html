!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Invoice & Bill Maker Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); box-sizing: border-box; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 15px; }
        .btn-add { background: #3b82f6; color: white; }
        .btn-del { background: #ef4444; color: white; padding: 6px 10px; }
        .btn-print { background: #22c55e; color: white; width: 100%; font-size: 16px; padding: 14px; margin-top: 25px; }
        .summary-box { margin-top: 25px; text-align: right; font-size: 16px; line-height: 1.8; padding-right: 10px; }
        .grand-total { font-size: 20px; font-weight: bold; color: #22c55e; border-top: 1px solid #334155; padding-top: 8px; display: inline-block; }
        .notes-section { margin-top: 20px; }

        /* Print / PDF Styles - Fixed right margin cutting */
        @media print {
            @page { margin: 15mm; }
            body { background: white; color: black; padding: 0; margin: 0; }
            .container { box-shadow: none; background: white; color: black; width: 100%; max-width: 100%; padding: 10px; }
            input, select, textarea { border: none; background: transparent; color: black; padding: 0; font-weight: bold; resize: none; }
            .btn, .no-print { display: none !important; }
            th { background: #f1f5f9 !important; color: black !important; }
            .grand-total { color: #15803d !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧾 Freelance Invoice Maker</h1>

    <div class="grid">
        <div>
            <label>Your Name / Agency Name</label>
            <input type="text" id="myName" placeholder="e.g. Vivek Web & AI Studio">
        </div>
        <div>
            <label>Client Name / Company</label>
            <input type="text" id="clientName" placeholder="e.g. Dubai Tech Solutions">
        </div>
        <div>
            <label>Invoice Number</label>
            <input type="text" id="invNumber" value="INV-001">
        </div>
        <div>
            <label>Invoice Date</label>
            <input type="date" id="invDate">
        </div>
        <div>
            <label>Currency</label>
            <select id="currency" onchange="calculateTotal()">
                <option value="$">USD ($) - International</option>
                <option value="AED ">AED - Dubai</option>
                <option value="₹">INR (₹) - India</option>
            </select>
        </div>
        <div>
            <label>Tax / VAT / GST (%)</label>
            <input type="number" id="taxRate" value="0" min="0" max="100" oninput="calculateTotal()">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Service / Work Description</th>
                <th style="width: 75px;">Qty/Hrs</th>
                <th style="width: 110px;">Rate</th>
                <th style="width: 110px;">Amount</th>
                <th class="no-print" style="width: 45px;"></th>
            </tr>
        </thead>
        <tbody id="itemsBody">
            <tr>
                <td><input type="text" placeholder="e.g. AI Website Development" class="desc"></td>
                <td><input type="number" value="1" min="1" class="qty" oninput="calculateTotal()"></td>
                <td><input type="number" value="100" min="0" class="rate" oninput="calculateTotal()"></td>
                <td class="row-total">$100.00</td>
                <td class="no-print"><button class="btn btn-del" onclick="removeRow(this)">X</button></td>
            </tr>
        </tbody>
    </table>

    <button class="btn btn-add no-print" onclick="addRow()">+ Add More Service</button>

    <div class="summary-box">
        <div>Subtotal: <strong id="subTotal">$100.00</strong></div>
        <div>Tax (<span id="taxDisplay">0</span>%): <strong id="taxAmount">$0.00</strong></div>
        <div class="grand-total">Total Payable: <span id="grandTotal">$100.00</span></div>
    </div>

    <div class="notes-section">
        <label>Payment Details / Notes (UPI, Bank, or Terms)</label>
        <textarea id="notes" rows="2" placeholder="e.g. Thank you for your business! Payment due within 7 days."></textarea>
    </div>

    <button class="btn btn-print no-print" onclick="window.print()">🖨️ Download / Save as PDF</button>
</div>

<script>
    // Set today's date automatically
    document.getElementById("invDate").valueAsDate = new Date();

    function addRow() {
        const tbody = document.getElementById("itemsBody");
        const row = document.createElement("tr");
        row.innerHTML = `
            <td><input type="text" placeholder="Service description..." class="desc"></td>
            <td><input type="number" value="1" min="1" class="qty" oninput="calculateTotal()"></td>
            <td><input type="number" value="50" min="0" class="rate" oninput="calculateTotal()"></td>
            <td class="row-total">0.00</td>
            <td class="no-print"><button class="btn btn-del" onclick="removeRow(this)">X</button></td>
        `;
        tbody.appendChild(row);
        calculateTotal();
    }

    function removeRow(btn) {
        const row = btn.parentElement.parentElement;
        row.remove();
        calculateTotal();
    }

    function calculateTotal() {
        const currency = document.getElementById("currency").value;
        const taxRate = parseFloat(document.getElementById("taxRate").value) || 0;
        const rows = document.querySelectorAll("#itemsBody tr");
        let subTotal = 0;

        rows.forEach(row => {
            const qty = parseFloat(row.querySelector(".qty").value) || 0;
            const rate = parseFloat(row.querySelector(".rate").value) || 0;
            const total = qty * rate;
            row.querySelector(".row-total").innerText = currency + total.toFixed(2);
            subTotal += total;
        });

        const taxAmount = (subTotal * taxRate) / 100;
        const grandTotal = subTotal + taxAmount;

        document.getElementById("subTotal").innerText = currency + subTotal.toFixed(2);
        document.getElementById("taxDisplay").innerText = taxRate;
        document.getElementById("taxAmount").innerText = currency + taxAmount.toFixed(2);
        document.getElementById("grandTotal").innerText = currency + grandTotal.toFixed(2);
    }

    calculateTotal();
</script>

</body>
</html>
